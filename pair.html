<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXTY · Pair Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #07090e;
      --bg-panel: rgba(16, 19, 28, 0.75);
      --border-light: rgba(255, 255, 255, 0.06);
      --green: #22d379;
      --green-glow: rgba(34, 211, 121, 0.25);
      --violet: #7c5cff;
      --violet-glow: rgba(124, 92, 255, 0.20);
      --text-primary: #f0f4fe;
      --text-muted: #8691a8;
      --radius: 24px;
      --shadow-card: 0 40px 100px rgba(0, 0, 0, 0.7);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- ANIMATED BACKGROUND ---------- */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 30% 20%, rgba(34, 211, 121, 0.06), transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(124, 92, 255, 0.06), transparent 50%);
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    .bg-orb:nth-child(1) {
      width: 400px; height: 400px;
      top: -10%; left: -10%;
      background: var(--green);
      animation-duration: 14s;
    }
    .bg-orb:nth-child(2) {
      width: 500px; height: 500px;
      bottom: -20%; right: -10%;
      background: var(--violet);
      animation-duration: 18s;
      animation-delay: -4s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.2); }
    }

    /* ---------- GLASS CARD ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: var(--bg-panel);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      border-radius: var(--radius);
      padding: 44px 34px 36px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: transform 0.3s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card), 0 0 60px rgba(34, 211, 121, 0.04);
    }

    /* ---------- BRANDING ---------- */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .brand .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 211, 121, 0.15);
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .brand .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .brand .label span {
      color: var(--green);
    }

    /* ---------- TITLE ---------- */
    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 9vw, 3.4rem);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 6px;
    }

    .title .highlight {
      background: linear-gradient(120deg, var(--green), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .status-line {
      margin: 24px 0 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .status-line .line {
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }

    /* ---------- INPUT WRAP ---------- */
    .input-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .input-wrap .country-code {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: var(--text-muted);
      pointer-events: none;
      background: var(--bg-primary);
      padding: 0 6px;
      border-radius: 8px;
      opacity: 0.7;
    }

    input {
      width: 100%;
      border: 1.5px solid var(--border-light);
      outline: none;
      padding: 20px 20px 20px 68px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-primary);
      font-size: 1.1rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 5px rgba(34, 211, 121, 0.08), inset 0 0 0 1px rgba(34, 211, 121, 0.1);
      background: rgba(255, 255, 255, 0.04);
    }

    input::placeholder {
      color: #3f475a;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    /* ---------- BUTTON ---------- */
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      color: #06110b;
      background: linear-gradient(135deg, var(--green), #2ed78b);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.3s, filter 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(34, 211, 121, 0.25);
      filter: brightness(1.05);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    .btn-primary:disabled {
      opacity: 0.6;
      filter: grayscale(0.3);
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ---------- RESULT PANEL ---------- */
    .result-panel {
      margin-top: 24px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-light);
      overflow: hidden;
      transition: all 0.3s ease;
      max-height: 0;
      opacity: 0;
      transform: translateY(8px);
      visibility: hidden;
    }

    .result-panel.open {
      max-height: 200px;
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      padding: 20px;
    }

    .result-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--text-primary);
      min-height: 60px;
    }

    .result-content .code {
      background: rgba(34, 211, 121, 0.08);
      padding: 6px 18px;
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 121, 0.15);
      box-shadow: 0 0 30px rgba(34, 211, 121, 0.04);
    }

    .result-content .status-icon {
      font-size: 1.4rem;
      line-height: 1;
      animation: fadePulse 1.2s ease-in-out infinite;
    }
    @keyframes fadePulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* ---------- FOOTER ---------- */
    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      padding: 4px 14px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-light);
      font-size: 0.6rem;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
    }

    .badge.highlight {
      border-color: rgba(34, 211, 121, 0.15);
      color: var(--green);
    }

    .footer .version {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      opacity: 0.6;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .card { padding: 30px 20px 24px; border-radius: 20px; }
      input { padding: 18px 16px 18px 58px; font-size: 1rem; }
      .result-content { font-size: 1.4rem; letter-spacing: 4px; }
      .footer { flex-direction: column; align-items: flex-start; }
    }

    /* ---------- UTILITY ---------- */
    .text-muted { color: var(--text-muted); }
    .text-error { color: #ff5a7a; }
    .text-success { color: var(--green); }
    .glow-green { box-shadow: 0 0 40px rgba(34, 211, 121, 0.05); }
  </style>
</head>
<body>

<!-- Background layers -->
<div class="bg-canvas">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
</div>

<!-- Main Card -->
<div class="card" id="app">

  <div class="brand">
    <span class="indicator"></span>
    <span class="label">NEXTY · <span>SECURE</span></span>
  </div>

  <h1 class="title">
    <span class="highlight">PAIR</span> CODE
  </h1>
  <p class="sub">Link your WhatsApp session instantly</p>

  <div class="status-line">
    <span class="line"></span>
    <span id="statusLabel">Ready</span>
    <span class="line"></span>
  </div>

  <div class="input-wrap">
    <span class="country-code">+92</span>
    <input type="text" id="number" placeholder="3XXXXXXXXX" inputmode="numeric" autofocus />
  </div>

  <button class="btn-primary" id="getCodeBtn">Generate Pair Code</button>

  <!-- Result Panel -->
  <div class="result-panel" id="resultPanel">
    <div class="result-content" id="resultContent">
      <span class="status-icon" id="statusIcon">⚡</span>
      <span class="code" id="codeDisplay">——</span>
    </div>
  </div>

  <div class="footer">
    <div class="badge-group">
      <span class="badge highlight">WhatsApp Bot</span>
      <span class="badge">NEXTY MINI</span>
      <span class="badge">v2.0</span>
    </div>
    <span class="version">⚡ built for performance</span>
  </div>
</div>

<script>
  (function() {
    const numberInput = document.getElementById('number');
    const getCodeBtn = document.getElementById('getCodeBtn');
    const resultPanel = document.getElementById('resultPanel');
    const codeDisplay = document.getElementById('codeDisplay');
    const statusIcon = document.getElementById('statusIcon');
    const statusLabel = document.getElementById('statusLabel');

    // Ripple effect on button
    getCodeBtn.addEventListener('click', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.style.width = ripple.style.height = '60px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    // Main function
    async function getCode() {
      const raw = numberInput.value.trim();
      const num = raw.replace(/[^0-9]/g, '');
      if (!num) {
        setResult('error', '⚠️', 'Enter your number first', '#ff5a7a');
        return;
      }

      // Show loading state
      setResult('loading', '⏳', 'Connecting...', '#7c5cff');
      getCodeBtn.disabled = true;
      statusLabel.textContent = 'Requesting...';

      try {
        const res = await fetch(`/code?number=${num}`);
        const data = await res.json();

        if (data.code) {
          setResult('success', '✅', data.code, '#22d379');
          statusLabel.textContent = 'Code received';
        } else {
          setResult('error', '❌', 'Server unavailable', '#ff5a7a');
          statusLabel.textContent = 'Error';
        }
      } catch (e) {
        setResult('error', '⚠️', 'Network error', '#ff5a7a');
        statusLabel.textContent = 'Failed';
      } finally {
        getCodeBtn.disabled = false;
      }
    }

    function setResult(type, icon, text, color) {
      resultPanel.classList.add('open');
      statusIcon.textContent = icon;
      codeDisplay.textContent = text;
      codeDisplay.style.color = color;
      // dynamic glow
      resultPanel.style.borderColor = color + '33';
    }

    // Event listeners
    getCodeBtn.addEventListener('click', getCode);
    numberInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        getCode();
      }
    });

    // Auto-focus
    setTimeout(() => numberInput.focus(), 400);

    // Automatically request code on load? No, wait for user.
    // But we can show a welcome state
    resultPanel.classList.add('open');
    statusIcon.textContent = '📡';
    codeDisplay.textContent = 'Ready';
    codeDisplay.style.color = '#8691a8';
    resultPanel.style.borderColor = 'rgba(255,255,255,0.04)';
    statusLabel.textContent = 'Awaiting number';

    // Animate the status label with a pulse effect (optional)
    let pulseInterval = setInterval(() => {
      // we could add small animation, but not necessary
    }, 1000);

  })();
</script>
</body>
</html>
