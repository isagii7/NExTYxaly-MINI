<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ NEXTY MINI ⚡</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           NEXTY MINI — CYBER / ANTITOXIN ANIMATION EDITION
           All functionality remains 100% unchanged.
           ============================================================ */

        /* ---------- RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d8a;
            --neon-purple: #a855f7;
            --neon-blue: #3b82f6;
            --bg-deep: #05080f;
            --glass-bg: rgba(5, 8, 15, 0.88);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- ANIMATED BG: CYBER GRID + GLOW ---------- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                /* grid lines */
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .orb--1 {
            width: 500px;
            height: 500px;
            top: -10%;
            left: -10%;
            background: var(--neon-purple);
            animation-delay: 0s;
        }
        .orb--2 {
            width: 400px;
            height: 400px;
            bottom: -10%;
            right: -10%;
            background: var(--neon-cyan);
            animation-delay: -6s;
        }
        .orb--3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--neon-pink);
            animation-delay: -12s;
            opacity: 0.12;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, -40px) scale(1.2);
            }
        }

        /* ---------- SCANLINE (subtle) ---------- */
        .scanline {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 240, 255, 0.008) 2px,
                    rgba(0, 240, 255, 0.008) 4px);
        }

        /* ---------- CARD ---------- */
        .card {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 36px 24px 30px;
            text-align: center;
            border: 1px solid rgba(0, 240, 255, 0.08);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(0, 240, 255, 0.06),
                0 0 80px rgba(0, 240, 255, 0.02);
            transition: all 0.3s;
            overflow: hidden;
        }

        /* glowing border animation */
        .card::before {
            content: '';
            position: absolute;
            inset: -2px;
            z-index: -1;
            border-radius: 34px;
            padding: 2px;
            background: conic-gradient(from 0deg,
                    transparent,
                    var(--neon-cyan),
                    var(--neon-pink),
                    var(--neon-purple),
                    var(--neon-cyan),
                    transparent 60%);
            background-size: 300% 300%;
            animation: spinBorder 8s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.3;
        }

        @keyframes spinBorder {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 300% 50%;
            }
        }

        /* ---------- TYPOGRAPHY ---------- */
        .title-main {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 2.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            background-size: 300% 300%;
            animation: gradShift 4s ease-in-out infinite alternate;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
            text-shadow: 0 0 60px rgba(0, 240, 255, 0.1);
        }

        .title-sub {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
            background-size: 200% 200%;
            animation: gradShift 3s ease-in-out infinite alternate-reverse;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        @keyframes gradShift {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* status */
        .status {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            margin: 6px 0 18px 0;
            font-family: 'Orbitron', monospace;
        }

        .status .highlight {
            color: var(--neon-cyan);
            font-weight: 600;
            animation: pulseText 2s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            }
        }

        /* ---------- INPUT (with cyber glow) ---------- */
        .input-cyber {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 16px auto;
            padding: 3px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            background-size: 300% 300%;
            animation: gradShift 4s ease-in-out infinite alternate;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.05);
            transition: all 0.3s;
        }

        .input-cyber:focus-within {
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.15);
        }

        .input-cyber input {
            width: 100%;
            border: none;
            outline: none;
            padding: 16px 18px;
            border-radius: 16px;
            background: #0a0e17;
            color: #fff;
            text-align: center;
            font-size: 1.05rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .input-cyber input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .input-cyber input:focus {
            background: #0c111f;
        }

        /* ---------- BUTTON (cyber) ---------- */
        .btn-cyber {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            padding: 3px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
            background-size: 300% 300%;
            animation: gradShift 4s ease-in-out infinite alternate;
            border: none;
            cursor: pointer;
            display: block;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255, 45, 138, 0.05);
        }

        .btn-cyber:hover {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(255, 45, 138, 0.2);
        }

        .btn-cyber:active {
            transform: scale(0.97);
        }

        .btn-inner {
            background: #0a0e17;
            color: #fff;
            display: block;
            padding: 14px 16px;
            border-radius: 16px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        .btn-cyber:hover .btn-inner {
            background: #0f1625;
            color: #fff;
        }

        /* ---------- RESULT BOX (cyber) ---------- */
        .result-cyber {
            width: 100%;
            max-width: 340px;
            margin: 18px auto 0;
            padding: 3px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            background-size: 300% 300%;
            animation: gradShift 5s ease-in-out infinite alternate;
            display: none;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.04);
            transition: all 0.4s;
        }

        .result-cyber.show {
            display: block;
            animation: resultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes resultPop {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-inner {
            background: #0a0e17;
            border-radius: 16px;
            padding: 18px 16px;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }

        #codeBox {
            letter-spacing: 4px;
            color: #fff;
            cursor: default;
            font-family: 'Orbitron', monospace;
            font-weight: 600;
            word-break: break-all;
        }

        /* ---------- LOADER (cyber spinner) ---------- */
        .loader-cyber {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.04);
            border-top: 3px solid var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- BADGES ---------- */
        .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
        }

        .badge {
            padding: 5px 16px;
            border-radius: 30px;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid rgba(0, 240, 255, 0.06);
            font-size: 0.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 500;
            font-family: 'Orbitron', monospace;
            transition: all 0.3s;
        }

        .badge:hover {
            border-color: rgba(0, 240, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }

        /* footer */
        .footer-credit {
            margin-top: 18px;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.12);
            font-family: 'Orbitron', monospace;
            border-top: 1px solid rgba(0, 240, 255, 0.04);
            padding-top: 18px;
        }

        .footer-credit .glow {
            color: rgba(0, 240, 255, 0.25);
            font-weight: 600;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .card {
                padding: 28px 16px 24px;
                border-radius: 24px;
            }
            .title-main {
                font-size: 1.6rem;
            }
            .title-sub {
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
            .input-cyber input {
                padding: 14px 14px;
                font-size: 0.95rem;
            }
            .btn-inner {
                font-size: 0.8rem;
                padding: 12px 14px;
            }
            .result-inner {
                font-size: 1rem;
                padding: 14px 12px;
                min-height: 54px;
            }
            #codeBox {
                letter-spacing: 2px;
            }
        }

        @media (max-width: 380px) {
            .title-main {
                font-size: 1.3rem;
            }
            .title-sub {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ORBS ===== -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
    <div class="scanline"></div>

    <!-- ===== CARD ===== -->
    <div class="card">

        <!-- titles -->
        <div class="title-main">⚡ NEXTY MINI</div>
        <div class="title-sub">PAIR CODE</div>

        <p class="status">
            <span class="highlight">●</span> TYPE YOUR WHATSAPP NUMBER <span class="highlight">●</span>
        </p>

        <!-- ===== INPUT (cyber) ===== -->
        <div class="input-cyber">
            <input type="text" id="number" placeholder="923237045919" />
        </div>

        <!-- ===== BUTTON (cyber) ===== -->
        <button class="btn-cyber" onclick="getCode()">
            <span class="btn-inner">⟡ GET PAIR CODE ⟡</span>
        </button>

        <!-- ===== RESULT (cyber) ===== -->
        <div class="result-cyber" id="borderBox">
            <div class="result-inner">
                <span id="codeBox">----</span>
            </div>
        </div>

        <!-- ===== BADGES ===== -->
        <div class="badge-group">
            <span class="badge">🤖 WHATSAPP BOT</span>
            <span class="badge">⚡ NEXTY-MINI</span>
            <span class="badge">✨ 2026</span>
        </div>

        <div class="footer-credit">
            <span class="glow">◆</span> MADE BY NEXTY-MINI <span class="glow">◆</span>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT — 100% ORIGINAL FUNCTIONALITY — NO CHANGES
    ============================================================ -->
    <script>
        // ===== EXACT ORIGINAL FUNCTIONALITY - NO CHANGES =====
        async function getCode() {
            const num = document.getElementById("number").value.replace(/[^0-9]/g, '');
            const codeBox = document.getElementById("codeBox");
            const borderBox = document.getElementById("borderBox");

            // Agar number khali hai
            if (!num) {
                borderBox.style.display = "block";
                borderBox.classList.add("show");
                codeBox.style.letterSpacing = "normal";
                codeBox.style.color = "#ff2d8a";
                codeBox.innerText = "APNA WHATSAPP NUMBER LIKHE";
                return;
            }

            // Loading State
            borderBox.style.display = "block";
            borderBox.classList.add("show");
            codeBox.style.letterSpacing = "normal";
            codeBox.style.color = "#00f0ff";
            codeBox.innerText = "CONNECTING.....";

            try {
                const res = await fetch(`/code?number=${num}`);
                const data = await res.json();

                if (data.code) {
                    codeBox.style.letterSpacing = "4px";
                    codeBox.style.color = "#fff";
                    codeBox.innerText = data.code;
                } else {
                    codeBox.style.color = "#ff2d8a";
                    codeBox.innerText = "SERVER FULL";
                }
            } catch (e) {
                codeBox.style.color = "#ff2d8a";
                codeBox.innerText = "SERVER IS FULL";
            }
        }

        // Enter key support
        document.getElementById("number").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                getCode();
            }
        });
    </script>

</body>
</html>
